name: Sync release body

# One-off maintenance job: replace the existing v0.9.40 release body with its
# own section from RELEASE_NOTES.md. Removed again once it has run.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-release-body.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Update the v0.9.40 release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=0.9.40
          awk -v header="## ${VERSION}" '
            $0 == header { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' RELEASE_NOTES.md | sed '/./,$!d' > release-notes.md
          gh release edit "v${VERSION}" --notes-file release-notes.md
