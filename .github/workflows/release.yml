name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build plugin
        run: npm run build

      - name: Verify version consistency
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION="$(node -p "require('./src/plugin.json').info.version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PLUGIN_VERSION" || { echo "tag $TAG_VERSION != plugin $PLUGIN_VERSION"; exit 1; }
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || { echo "tag $TAG_VERSION != package $PACKAGE_VERSION"; exit 1; }

      - name: Package plugin
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="release/acme-command-center-app"
          rm -rf release
          mkdir -p "$STAGE/img"
          cp dist/module.js dist/module.js.map "$STAGE/"
          cp src/plugin.json "$STAGE/plugin.json"
          cp README.md "$STAGE/README.md"
          cp img/logo.svg "$STAGE/img/logo.svg"
          (cd release && zip -r "../acme-command-center-app-${VERSION}.zip" acme-command-center-app)
          sha256sum "acme-command-center-app-${VERSION}.zip" > "acme-command-center-app-${VERSION}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "acme-command-center-app-${VERSION}.zip" \
            "acme-command-center-app-${VERSION}.zip.sha256" \
            --title "OpsBeacon ${VERSION}" \
            --notes-file RELEASE_NOTES.md
